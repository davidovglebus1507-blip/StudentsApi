name: Client CI
 
on:
  push:
  pull_request:
 
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-examples
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: react-examples/dist/
